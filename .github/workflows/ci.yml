name: CI

on:
  push:
    branches: [master]
  pull_request:

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run typecheck
      - run: npm run build
      - name: Smoke test
        run: |
          npm run fixtures
          cd fixtures/out
          node ../../dist/cli.js doctor || true
          node ../../dist/cli.js style > /dev/null
          node ../../dist/cli.js prompts
          for t in $(node -e "console.log(require('./art/manifest.json').map(t => t.target).join(' '))"); do node ../../dist/cli.js prompt $t > /dev/null; done
          node ../../dist/cli.js cut
          node ../../dist/cli.js final
          node ../../dist/cli.js sheet
          node ../../dist/cli.js pack --allow-pending
